version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: OSUGoPokes
      MYSQL_DATABASE: iem4723_mysql_tutorial
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-container
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: OSUGoPokes
    depends_on:
      - mysql

  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: jupyter-container
    restart: always
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "OSUGoPokes"
    volumes:
      - .:/home/jovyan/iem4723/
    depends_on:
      - mysql
    command: >
      bash -c "pip install --quiet pymysql sqlalchemy &&
               start-notebook.sh --NotebookApp.token='OSUGoPokes' --NotebookApp.password=''"

volumes:
  mysql-data:
