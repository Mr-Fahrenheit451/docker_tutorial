version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis-container
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: redis-jupyter-container
    restart: always
    ports:
      - "8889:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "OSUGoPokes"
    volumes:
      - ..:/home/jovyan/iem4723/
    depends_on:
      - redis
    command: >
      bash -c "pip install --quiet redis &&
               start-notebook.sh --NotebookApp.token='OSUGoPokes' --NotebookApp.password=''"

volumes:
  redis-data:
